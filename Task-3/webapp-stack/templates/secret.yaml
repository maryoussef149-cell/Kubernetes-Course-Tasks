apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  root-password: {{ .Values.mysql.auth.rootPassword | quote }}
  app-user: {{ .Values.mysql.auth.appUser | quote }}
  app-password: {{ .Values.mysql.auth.appPassword | quote }}
  replication-password: {{ .Values.mysql.auth.replicationPassword | quote }}
